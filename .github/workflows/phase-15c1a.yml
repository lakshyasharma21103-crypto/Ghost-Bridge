name: Phase 15C.1A Linux verification

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: phase-15c1a-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20
          - 22
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: development
      MONGODB_URI: mongodb://127.0.0.1:27017
      MONGODB_DB_NAME: ghost_bridge_ci_${{ github.run_id }}_${{ matrix.node-version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify Phase 15C.1
        run: npm run verify:ghostbridge-phase-15c1

      - name: Verify Phase 15C.1A
        run: npm run verify:ghostbridge-phase-15c1a

      - name: Verify database-backed deterministic fixtures
        run: |
          npm run verify:demo
          npm run verify:sandbox
          npm run verify:enterprise-operations
          npm run verify:durable-recovery

      - name: Verify public package dry-runs
        run: npm run verify:ghostbridge-package-integrity
